[project]
name = "customer-service-agent-v0"
version = "0.1.0"
description = "Deterministic transaction backend and evaluation foundation for an e-commerce customer-service agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic[email]>=2.8,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pip-audit>=2.8,<3.0",
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app", "evals"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"evals/run_*_evals.py" = ["E402"]
"evals/verify_eval_bundle.py" = ["E402"]
"scripts/export_contracts.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["app", "evals", "scripts"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
