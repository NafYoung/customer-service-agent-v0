name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, contracts, types, and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_DEBUG_ROUTES: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app evals tests scripts

      - name: Type check
        run: python -m mypy

      - name: Verify generated contracts
        run: python scripts/export_contracts.py --check

      - name: Run tests with branch coverage
        run: >-
          python -m pytest
          --cov=app
          --cov=evals
          --cov-branch
          --cov-fail-under=80

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --progress-spinner off

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
